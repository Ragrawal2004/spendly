{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block content %}

<section class="auth-section expense-form-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add an expense</h1>
            <p class="auth-subtitle">Record what you spent and where it went</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="text" id="amount" name="amount"
                           class="form-input" placeholder="250"
                           inputmode="decimal" maxlength="18"
                           value="{{ amount }}" required autofocus>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="" disabled{% if category not in categories %} selected{% endif %}>Choose a category</option>
                        {% for c in categories %}
                        <option value="{{ c }}"{% if c == category %} selected{% endif %}>{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date_value }}" min="{{ min_date }}" max="{{ max_date }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description (optional)</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="Lunch with the team"
                           maxlength="{{ max_description }}"
                           value="{{ description }}">
                </div>
                <button type="submit" class="btn-submit">Add expense</button>
                <a href="{{ url_for('profile') }}" class="form-cancel">Cancel</a>
            </form>
        </div>

    </div>
</section>

{% endblock %}
